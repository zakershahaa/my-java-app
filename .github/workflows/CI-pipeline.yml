name: Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 1: Code test aur compile karke JAR file banana
    - name: Build with Maven
      run: mvn clean package

    # Step 2: Banana gaya JAR file GitHub Actions Artifacts mein save karna
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-java-app-jar
        path: target/*.jar
